name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - 'test/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - 'test/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: 'eu-north-1'
  TF_VERSION: '1.16.5'
  TFLINT_VERSION: '0.66.0'

jobs:
  terraform:
    name: 'Lint, Security Check, Plan and Apply'
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 'Set up Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: 'Install TFLint'
        run: |
          curl -sSLo /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
          sudo unzip -o /tmp/tflint.zip -d /usr/local/bin/
          tflint --version

      - name: 'Terraform Init'
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: 'Terraform Format'
        run: terraform fmt -check -recursive

      - name: 'Terraform Validate'
        run: terraform validate

      - name: 'TFLint'
        run: |
          tflint --init
          tflint

      - name: 'Trivy'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          hide-progress: true
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: 'Terraform Plan'
        run: terraform plan -out=tfplan

      - name: 'Terraform Apply'
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply tfplan

      - name: 'Set up Go'
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        uses: actions/setup-go@v5
        with:
          go-version-file: test/go.mod
          cache: false

      - name: 'Terratest'
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        working-directory: test
        run: |
          go mod tidy
          go test -v -count=1 -timeout 15m ./...

  destroy:
    name: 'Destroy'
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 'Set up Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 'Terraform Init'
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: 'Terraform Destroy'
        run: terraform destroy -auto-approve
